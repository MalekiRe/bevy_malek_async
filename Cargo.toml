[package]
name = "bevy_malek_async"
version = "0.3.0"
edition = "2024"
readme = "README.md"
authors = ["pocmalek@gmail.com"]
license = "MIT OR Apache-2.0"
description = "async runtime agnostic access to the bevy ecs"
keywords = ["bevy", "async"]

[features]
default = ["std", "bevy_tasks"]

std = [
    "bevy_app/std",
    "bevy_ecs/std",
    "bevy_platform/std",
    "scoped_static_storage/std",
    "keyed_concurrent_queue/std",
]

[dependencies]
# bevy
bevy_app = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev", default-features = false }
bevy_ecs = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev", default-features = false }
bevy_ecs_macros = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev" }
bevy_platform = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev", default-features = false }
bevy_tasks = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev", default-features = false, optional = true }
bevy_scene = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev" }

# other
scoped_static_storage = { version = "0.1.2", default-features = false }
keyed_concurrent_queue = { version = "0.1.3", default-features = false }
thiserror = { version = "2", default-features = false }
crossbeam = "0.8.4"
async-channel = "2.5.0"
futures = "0.3.32"
bevy_malek_async_macros = { path = "./macros"}

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
]
all-features = true

[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", version = "0.19.0-dev", features = ["experimental_bevy_feathers"] }
rand = "0.10.1"
futures-timer = "3.0.3"
tokio = {version = "1.52.1", features = ["full"]}
reqwest = "0.13.2"